onospace" font-size="12.5" fill="#e6e9f5">POST /v1/resolve  { need }</text><line x1="289.33333333333337" y1="282" x2="126.0" y2="282" stroke="#6ee7b7" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="132.0" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6e9f5">plan: capability, price, terms</text><rect x="40" y="325" width="1200" height="26" rx="8" fill="rgba(255,255,255,0.025)"/><text x="56" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="11.5" letter-spacing="2.4" font-weight="700" fill="#7dd3fc">DECIDE AND CHARGE  ·  before money moves</text><line x1="124.0" y1="374" x2="287.33333333333337" y2="374" stroke="#7dd3fc" stroke-width="1.6"  marker-end="url(#ah)"/><text x="132.0" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6e9f5">POST /tools/{capability}  (unpaid)</text><line x1="297.33333333333337" y1="414" x2="460.6666666666667" y2="414" stroke="#7dd3fc" stroke-width="1.6"  marker-end="url(#ah)"/><text x="305.33333333333337" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6e9f5">admit · price · bound</text><line x1="289.33333333333337" y1="454" x2="126.0" y2="454" stroke="#6ee7b7" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="132.0" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6e9f5">402 Payment Required  +  PAYMENT-REQUIRED (x402 v2)</text><rect x="268.1" y="480" width="743.8" height="30" rx="8" fill="rgba(167,139,250,0.10)" stroke="#a78bfa" stroke-opacity="0.45"/><text x="640.0" y="499" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="13" fill="#ddd6fe">agent checks terms against i